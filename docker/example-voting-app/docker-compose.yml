services:
  vote:
    image: vote:latest
    ports:
      - "5000:80"
    depends_on:
      - redis
  redis:
    image: redis:alpine
  worker:
    image: worker:latest
    depends_on:
      - redis
      - db
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
  result:
    image: result:latest
    ports:
      - "5001:80"
    depends_on:
      - db
